<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>APEX HYBRID — Training & Nutrition</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #000000;
      --surface: #111113;
      --card: #1C1C1E;
      --elevated: #2C2C2E;
      --input: #2C2C2E;
      --border: #2D2D37;
      --accent: #92E82A;
      --success: #22C55E;
      --danger: #EF4444;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      min-height: -webkit-fill-available;
      background: #000000;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .duo-shell {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      min-height: -webkit-fill-available;
      background: var(--bg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 0;
    }
    .duo-grid {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .left-pane {
      display: none;
    }
    .right-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .rail-nav {
      display: none;
    }
    .bottom-nav {
      display: grid;
    }
    @media (min-width: 768px) {
      body { padding: 0; }
      .duo-shell {
        max-width: none;
        max-height: none;
        border: none;
        border-radius: 0;
        box-shadow: none;
        padding: 0;
      }
      .duo-grid {
        flex-direction: row;
      }
      .left-pane {
        display: flex;
        flex-direction: column;
        width: 38%;
        border-right: 1px solid #1F1F26;
        background: #08080A;
        overflow-y: auto;
        padding: 18px 16px;
      }
      .right-pane {
        flex: 1;
        background: var(--bg);
      }
      .rail-nav {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        width: auto;
        min-width: 64px;
        background: #08080A;
        border-left: 1px solid #1F1F26;
        padding-top: max(16px, env(safe-area-inset-top));
        padding-bottom: max(10px, env(safe-area-inset-bottom));
        padding-left: 10px;
        padding-right: max(12px, env(safe-area-inset-right));
        flex-shrink: 0;
      }
      .bottom-nav {
        display: none;
      }
    }
    .scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      scrollbar-width: thin;
      scrollbar-color: #2D2D37 transparent;
    }
    .num-input {
      background: var(--input);
      color: #fff;
      border-radius: 8px;
      height: 36px;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
      width: 100%;
      border: 1px solid transparent;
      outline: none;
      font-variant-numeric: tabular-nums;
    }
    .num-input:focus { border-color: var(--accent); }
    .tab-btn {
      border-radius: 9999px;
      transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }
    .tab-btn.active {
      color: var(--accent);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.10) 0%, rgba(146, 232, 42, 0.14) 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 2px 8px rgba(0, 0, 0, 0.45);
    }
    .pill-active { background: var(--accent) !important; color: #0B0B0D !important; }
  </style>
</head>
<body>
  <div class="duo-shell">
    <!-- Mobile-only top header -->
    <div class="md:hidden px-5 pb-2 flex items-center justify-between border-b border-[#1F1F26] bg-[#000000]" style="padding-top: max(12px, env(safe-area-inset-top));">
      <span class="text-[11px] font-bold tracking-widest text-[#92E82A]">APEX HYBRID</span>
      <span id="unitBadgeMobile" class="text-[11px] font-semibold px-2 py-0.5 rounded bg-[#1C1C1E] text-[#8E8E93]">LB</span>
    </div>

    <div class="duo-grid">
      <!-- LEFT PANE (Duo Plan Overview Timeline) -->
      <aside id="leftPane" class="left-pane"></aside>

      <!-- CENTER/RIGHT WORKSPACE PANE -->
      <main class="right-pane">
        <div id="mainContent" class="scroll-area"></div>

        <!-- Docked Start Workout Footer (Today tab) -->
        <div id="todayFooter" class="hidden px-4 pt-2.5 bg-[#000000]/95 border-t border-[#1C1C1E]" style="padding-bottom: max(10px, env(safe-area-inset-bottom));">
          <button id="btnStartToday" class="w-full py-3.5 rounded-full bg-[#92E82A] text-[#000000] font-extrabold text-sm tracking-wide shadow-lg">
            START WORKOUT
          </button>
        </div>

        <!-- Floating Rest Timer Bar -->
        <div id="restTimerBar" class="hidden bg-[#2C2C2E] border-t border-[#2D2D37] px-4 py-2.5 relative">
          <div id="restProgress" class="absolute top-0 left-0 h-[3px] bg-[#92E82A] transition-all" style="width: 100%"></div>
          <div class="flex items-center justify-between gap-2">
            <div class="min-w-0">
              <div class="text-[10px] font-bold tracking-wider text-[#92E82A]">REST TIMER</div>
              <div class="flex items-baseline gap-2">
                <span id="restTimeText" class="text-xl font-bold tabular-nums">3:00</span>
                <span id="restExText" class="text-xs text-[#8E8E93] truncate"></span>
              </div>
            </div>
            <div class="flex items-center gap-1.5">
              <button id="btnRestMinus" class="px-2.5 py-1.5 rounded-lg bg-[#2C2C2E] text-xs font-semibold">-30s</button>
              <button id="btnRestPlus" class="px-2.5 py-1.5 rounded-lg bg-[#2C2C2E] text-xs font-semibold">+30s</button>
              <button id="btnRestPause" class="px-2.5 py-1.5 rounded-lg bg-[#2C2C2E] text-xs font-semibold text-[#92E82A]">Pause</button>
              <button id="btnRestSkip" class="px-2.5 py-1.5 rounded-lg bg-[#2C2C2E] text-xs font-semibold">Skip</button>
            </div>
          </div>
        </div>
      </main>

      <!-- FAR-RIGHT VERTICAL ICON RAIL (Duo Mode) -->
      <aside class="rail-nav">
        <div class="flex flex-col items-center gap-2.5">

          <a href="https://www.fitnessfaqs.com/products/hybrid/categories/2160420193/posts/2198872813" target="_blank" rel="noopener noreferrer" title="FitnessFAQs Hybrid Portal"
            class="w-10 h-10 rounded-full bg-[#1C1C1E] border border-[#2D2D37] flex items-center justify-center text-[#8E8E93] hover:text-[#92E82A]">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </a>
        </div>

        <div class="bg-[#1C1C1E] border border-[#2D2D37] rounded-full p-1.5 flex flex-col items-center gap-2">
          <button class="tab-btn active w-10 h-10 rounded-full flex items-center justify-center transition-colors" data-tab="today" title="Today">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          </button>
          <button class="tab-btn text-[#636366] w-10 h-10 rounded-full flex items-center justify-center transition-colors" data-tab="train" title="Train">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5h11"/><path d="M6.5 17.5h11"/><path d="M4 9.5v5"/><path d="M20 9.5v5"/><path d="M6.5 5v14"/><path d="M17.5 5v14"/><path d="M2 11v2"/><path d="M22 11v2"/></svg>
          </button>
          <button class="tab-btn text-[#636366] w-10 h-10 rounded-full flex items-center justify-center transition-colors" data-tab="program" title="Program">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </button>
          <button class="tab-btn text-[#636366] w-10 h-10 rounded-full flex items-center justify-center transition-colors" data-tab="progress" title="Progress">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          </button>
          <button class="tab-btn text-[#636366] w-10 h-10 rounded-full flex items-center justify-center transition-colors" data-tab="nutrition" title="Nutrition">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.94c1.5 0 2.75 1.06 4 1.06 3 0 6-8 6-12.22A4.91 4.91 0 0 0 17 5c-2.22 0-4 1.44-5 2-1-.56-2.78-2-5-2a4.9 4.9 0 0 0-5 4.78C2 14 5 22 8 22c1.25 0 2.5-1.06 4-1.06Z"/><path d="M10 2c1 .5 2 2 2 5"/></svg>
          </button>
          <button class="tab-btn text-[#636366] w-10 h-10 rounded-full flex items-center justify-center transition-colors" data-tab="profile" title="Profile">

          </button>

      </aside>
    </div>

    <!-- Mobile Bottom Tab Bar (Apple Fitness+ Floating Glass Pill) -->

      <button class="tab-btn active h-12 flex flex-col items-center justify-center gap-0.5 text-[10px] font-semibold tracking-wide" data-tab="today">

      </button>

        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>

        <span>Profile</span>
      </button>
    </nav>

    <!-- In-App Modal -->
    <div id="modalOverlay" class="hidden absolute inset-0 bg-black/80 z-50 flex items-end sm:items-center justify-center p-4">
      <div class="w-full max-w-md bg-[#1C1C1E] border border-[#2D2D37] rounded-2xl p-4 max-h-[80vh] overflow-y-auto">
        <div class="flex items-center justify-between mb-3">
          <h3 id="modalTitle" class="text-base font-bold text-white">Modal</h3>
          <button id="modalClose" class="text-[#8E8E93] hover:text-white text-sm font-semibold px-2 py-1">Close</button>
        </div>
        <div id="modalBody" class="text-sm text-[#8E8E93]"></div>
      </div>
    </div>
  </div>

    const BARBELL_IDS = new Set(['ex-pendlay-row', 'ex-overhead-press', 'ex-larsen-bench', 'ex-incline-bench', 'ex-squat', 'ex-rdl', 'ex-good-morning']);
    function calcPlatesLb(totalWeight) {
      const bar = 45;
      if (!totalWeight || totalWeight <= bar) return 'Bar only (45 lb)';
      let perSide = (totalWeight - bar) / 2;
      const plates = [45, 35, 25, 10, 5, 2.5];
      const out = [];
      for (const pl of plates) {
        const count = Math.floor(perSide / pl + 1e-6);
        if (count > 0) { out.push(`${count}×${pl}`); perSide -= count * pl; }
      }
      return out.length ? `${out.join(' + ')} per side` : 'Bar only (45 lb)';
    }

    function loadSavedState() {
      try {
        const raw = localStorage.getItem('hs_app_backup_v1');
        if (raw) return JSON.parse(raw);
        const oldPrs = localStorage.getItem('hs_peak_weights');
        return oldPrs ? { peakWeights: JSON.parse(oldPrs) } : {};
      } catch (e) { return {}; }
    }
    function persistState() {
      try {
        const payload = {
          unit: state.unit,
          selectedWeek: state.selectedWeek,
          currentDayIdx: state.currentDayIdx,
          completedDays: state.completedDays,
          history: state.history,
          peakWeights: state.peakWeights,
          roundNumber: state.roundNumber,
          savedRounds: state.savedRounds,
          health: state.health,
          nutrition: state.nutrition,
        };
        localStorage.setItem('hs_app_backup_v1', JSON.stringify(payload));
      } catch (e) {}
    }
    function savePrs(map) {
      persistState();
    }

    const saved = loadSavedState();
    const state = {
      tab: 'today',
      unit: saved.unit || 'lb',
      selectedWeek: saved.selectedWeek || 1,
      currentDayIdx: saved.currentDayIdx || 0,
      completedDays: Array.isArray(saved.completedDays) ? saved.completedDays : [],
      activeSession: null,
      history: Array.isArray(saved.history) ? saved.history : [],
      peakWeights: saved.peakWeights || {},
      roundNumber: saved.roundNumber || 1,
      savedRounds: Array.isArray(saved.savedRounds) ? saved.savedRounds : [],
      nutrition: saved.nutrition || {
        goals: { calories: 2250, protein: 165, carbs: 230, fat: 70, water: 64, fiber: 28, sodium: 2300, caffeine: 400 },
        geminiKey: '',
        usdaKey: '',
        subTab: 'today',
        trendRange: 7,
        trendMetric: 'cal',
        nutrientScope: 'day',
        mode: 'quick',
        mealTarget: 'Breakfast',
        selectedDate: new Date().toISOString().slice(0, 10),
        logs: [],
        logsByDate: {}
      },
      health: saved.health || {
        connected: false,
        moveCal: 0, moveGoal: 800,
        exMin: 0, exGoal: 30,
        standHr: 0, standGoal: 12,
        sleepHrs: null, sleepScore: null,
        readiness: null
      },
      restTimer: { running: false, paused: false, total: 180, endMs: 0, pausedLeft: 0, exName: '' },
      timerInterval: null,
      chartInstance: null,
    };

    function startWorkoutForDay(dayIdx) {
      const day = getDaysForWeek(state.selectedWeek)[dayIdx];
      const exercises = day.items.map((item) => {
        const pr = state.peakWeights[item.exId];
        const baseWeight = pr ? pr.weight : '';
        const sets = Array.from({ length: item.sets }, (_, i) => ({
          num: i + 1, type: 'working', weight: baseWeight, reps: parseInt(item.reps, 10) || 8, rpe: 8, done: false,
        }));
        return { exId: item.exId, rx: item, sets, loadMode: 'added', sugDismissed: false, activeRpeSetIdx: null };
      });
      state.activeSession = { dayIdx, title: `WEEK ${state.selectedWeek} • ${day.name}`, startedAt: Date.now(), exercises };
      switchTab('train');
    }

    function startRestTimer(sec, exName) {
      if (state.timerInterval) clearInterval(state.timerInterval);
      state.restTimer = { running: true, paused: false, total: sec, endMs: Date.now() + sec * 1000, pausedLeft: sec, exName };
      renderRestBar();
      state.timerInterval = setInterval(renderRestBar, 250);
    }

    function renderRestBar() {
      const bar = document.getElementById('restTimerBar');
      const rt = state.restTimer;
      if (!rt.running) { bar.classList.add('hidden'); return; }
      bar.classList.remove('hidden');
      const left = rt.paused ? rt.pausedLeft : Math.max(0, Math.ceil((rt.endMs - Date.now()) / 1000));
      if (left === 0 && !rt.paused) { rt.running = false; clearInterval(state.timerInterval); bar.classList.add('hidden'); return; }
      const m = Math.floor(left / 60);
      const s = left % 60;
      document.getElementById('restTimeText').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
      document.getElementById('restExText').textContent = rt.exName;
      document.getElementById('btnRestPause').textContent = rt.paused ? 'Resume' : 'Pause';
      document.getElementById('restProgress').style.width = `${Math.min(100, (left / rt.total) * 100)}%`;
    }

    document.getElementById('btnRestMinus').addEventListener('click', () => {
      if (!state.restTimer.running) return;
      if (state.restTimer.paused) state.restTimer.pausedLeft = Math.max(0, state.restTimer.pausedLeft - 30);
      else state.restTimer.endMs = Math.max(Date.now(), state.restTimer.endMs - 30000);
      renderRestBar();
    });
    document.getElementById('btnRestPlus').addEventListener('click', () => {
      if (!state.restTimer.running) return;
      if (state.restTimer.paused) state.restTimer.pausedLeft += 30;
      else state.restTimer.endMs += 30000;
      state.restTimer.total += 30;
      renderRestBar();
    });
    document.getElementById('btnRestPause').addEventListener('click', () => {
      const rt = state.restTimer;
      if (!rt.running) return;
      if (rt.paused) { rt.paused = false; rt.endMs = Date.now() + rt.pausedLeft * 1000; }
      else { rt.pausedLeft = Math.max(0, Math.ceil((rt.endMs - Date.now()) / 1000)); rt.paused = true; }
      renderRestBar();
    });
    document.getElementById('btnRestSkip').addEventListener('click', () => {
      state.restTimer.running = false; clearInterval(state.timerInterval); renderRestBar();
    });

    function openModal(title, html) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = html;
      document.getElementById('modalOverlay').classList.remove('hidden');
    }
    document.getElementById('modalClose').addEventListener('click', () => {
      document.getElementById('modalOverlay').classList.add('hidden');
    });

    function switchTab(tab) {
      state.tab = tab;
      document.querySelectorAll('.tab-btn').forEach((btn) => {
        const active = btn.dataset.tab === tab;
        btn.classList.toggle('active', active);
        btn.classList.toggle('text-[#636366]', !active);
      });
      render();
    }
    document.querySelectorAll('.tab-btn').forEach((btn) => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    function cleanSleepHrs(raw) {
      if (raw === null || raw === undefined || raw === '') return null;
      let v = parseFloat(String(raw).replace(/[^0-9.\-]/g, ''));
      if (!Number.isFinite(v) || v <= 0) return null;
      if (v > 120) v = v / 3600; // Shortcuts Duration returns seconds
      else if (v > 24) v = v / 60; // minutes
      return Number(v.toFixed(1));
    }

    function renderAppleFitnessBento() {
      const h = state.health;
      const moveDisp = Math.round(Number(h.moveCal) || 0);
      const exDisp = Math.round(Number(h.exMin) || 0);
      const standDisp = Math.round(Number(h.standHr) || 0);
      const sleepHrsDisp = cleanSleepHrs(h.sleepHrs);
      const sleepScoreDisp = h.sleepScore !== null ? Math.round(Number(h.sleepScore)) : null;
      const movePct = Math.min(1, moveDisp / h.moveGoal);
      const exPct = Math.min(1, exDisp / h.exGoal);
      const standPct = Math.min(1, standDisp / h.standGoal);

      const r1 = 36, c1 = 2 * Math.PI * r1;
      const r2 = 27, c2 = 2 * Math.PI * r2;
      const r3 = 18, c3 = 2 * Math.PI * r3;

      const readyVal = h.readiness !== null ? h.readiness : '—';
      const readyLabel = h.readiness === null ? 'Tap to Connect' : (h.readiness >= 7 ? 'Ready' : h.readiness >= 5 ? 'Moderate' : 'Recover');

      return `

            <div class="flex items-center gap-4">
              <svg class="w-24 h-24 -rotate-90 shrink-0" viewBox="0 0 90 90">
                <circle cx="45" cy="45" r="${r1}" fill="none" stroke="#3A0D18" stroke-width="7.5" />

    function getActiveNutritionDate() {

    function shiftDateStr(dateStr, deltaDays) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d + deltaDays));
      return dt.toISOString().slice(0, 10);
    }

    function getLogsForDate(dateStr) {
      ensureNutriDefaults();
      if (!state.nutrition.logsByDate[dateStr]) state.nutrition.logsByDate[dateStr] = [];
      return state.nutrition.logsByDate[dateStr];
    }

    function getActiveNutritionLogs() {
      const d = getActiveNutritionDate();
      ensureNutriDefaults();
      if (state.nutrition.logs && state.nutrition.logs.length && !state.nutrition.logsByDate[d]) {
        state.nutrition.logsByDate[d] = state.nutrition.logs;
        state.nutrition.logs = [];
      }
      return getLogsForDate(d);
    }

    function sumNutritionItems(items) {
      const tot = { cal: 0, p: 0, c: 0, f: 0, micros: {} };
      FOODNOMS_MICRO_SCHEMA.forEach((m) => { tot.micros[m.key] = 0; });
      (items || []).forEach((item) => {
        tot.cal += Number(item.cal) || 0;
        tot.p += Number(item.p) || 0;
        tot.c += Number(item.c) || 0;
        tot.f += Number(item.f) || 0;
        const im = item.micros || {};
        FOODNOMS_MICRO_SCHEMA.forEach((m) => {
          tot.micros[m.key] += Number(im[m.key]) || 0;
        });
      });
      return tot;
    }

    function getNutritionTotals(dateStr) {
      return sumNutritionItems(dateStr ? getLogsForDate(dateStr) : getActiveNutritionLogs());
    }

    function getAllLoggedNutritionDates() {

        .sort();
    }

    function parseCsvLine(line) {
      const out = [];
      let cur = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQ && line[i + 1] === '"') { cur += '"'; i++; }
          else inQ = !inQ;
        } else if (ch === ',' && !inQ) {
          out.push(cur); cur = '';
        } else {
          cur += ch;
        }
      }
      out.push(cur);
      return out;
    }

    function importFoodnomsCsv(csvText) {
      const lines = csvText.split(/\r?\n/).filter((l) => l.trim().length > 0);
      if (lines.length < 2) return { count: 0, days: 0, latestDate: null };
      const headers = parseCsvLine(lines[0]).map((h) => h.trim().toLowerCase());
      const idx = (name) => headers.indexOf(name);
      const iDay = idx('day'), iTime = idx('time'), iTz = idx('time zone');
      const iName = idx('name'), iBrand = idx('brand'), iMeal = idx('meal type');
      const iPortion = idx('portion'), iAcc = idx('accuracy');
      const iCal = idx('energy (cal)'), iCarb = idx('total carbs (g)');
      const iPro = idx('protein (g)'), iFat = idx('total fat (g)');
      if (iDay < 0 || iName < 0 || iCal < 0) return { count: 0, days: 0, latestDate: null };

      const microIndices = FOODNOMS_MICRO_SCHEMA.map((m) => ({ key: m.key, idx: idx(m.csv) }));
      ensureNutriDefaults();
      const groupedByDay = {};
      let count = 0;
      const toNum = (v) => {
        const s = String(v || '').replace(/,/g, '').trim();
        return s ? (Number(s) || 0) : 0;
      };

      for (let r = 1; r < lines.length; r++) {
        const cols = parseCsvLine(lines[r]);
        const day = (cols[iDay] || '').trim();
        const name = (cols[iName] || '').trim();
        if (!day || !name) continue;
        const brand = iBrand >= 0 ? (cols[iBrand] || '').trim() : '';
        const portion = iPortion >= 0 ? (cols[iPortion] || '').trim() : '';
        const time = iTime >= 0 ? (cols[iTime] || '').trim() : '';
        const tz = iTz >= 0 ? (cols[iTz] || '').trim() : '';
        const accuracy = iAcc >= 0 ? (cols[iAcc] || '').trim() : '';
        const meal = (iMeal >= 0 ? (cols[iMeal] || '').trim() : '') || 'Other';

        const micros = {};
        microIndices.forEach((mi) => {
          if (mi.idx >= 0) {
            const val = toNum(cols[mi.idx]);
            if (val !== 0) micros[mi.key] = val;
          }
        });

        if (!groupedByDay[day]) groupedByDay[day] = [];
        groupedByDay[day].push({
          name,
          brand,
          portion,
          time,
          tz,
          accuracy,
          meal,
          cal: toNum(cols[iCal]),
          p: toNum(cols[iPro]),
          c: toNum(cols[iCarb]),
          f: toNum(cols[iFat]),
          micros,
        });
        count++;
      }

      const importedDays = Object.keys(groupedByDay).sort();
      importedDays.forEach((d) => {
        state.nutrition.logsByDate[d] = groupedByDay[d];
      });
      const latestDate = importedDays.length ? importedDays[importedDays.length - 1] : null;
      if (latestDate) state.nutrition.selectedDate = latestDate;
      return { count, days: importedDays.length, latestDate };
    }

    function exportFoodnomsCsv() {
      const headers = [
        'day', 'time', 'time zone', 'name', 'brand', 'meal type', 'portion', 'accuracy',
        'energy (Cal)', 'total carbs (g)', 'protein (g)', 'total fat (g)',
        ...FOODNOMS_MICRO_SCHEMA.map((m) => m.csv)
      ];
      const esc = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const rows = [headers.map(esc).join(',')];
      const dates = Object.keys(state.nutrition.logsByDate || {}).sort();
      dates.forEach((d) => {
        (state.nutrition.logsByDate[d] || []).forEach((it) => {
          const ms = it.micros || {};
          const row = [
            d, it.time || '', it.tz || '', it.name || '', it.brand || '', it.meal || '', it.portion || '', it.accuracy || '',
            it.cal || 0, it.c || 0, it.p || 0, it.f || 0,
            ...FOODNOMS_MICRO_SCHEMA.map((m) => ms[m.key] || '')
          ];
          rows.push(row.map(esc).join(','));
        });
      });
      return rows.join('\n');
    }

          const m = it.meal || 'Other';
          if (!mealBuckets[m]) mealBuckets[m] = [];
          mealBuckets[m].push({ ...it, _idx: idx });
        });
        const orderedMeals = [
          ...MEAL_ORDER.filter((m) => mealBuckets[m] && mealBuckets[m].length),
          ...Object.keys(mealBuckets).filter((m) => !MEAL_ORDER.includes(m))
        ];

        const rangeDays = state.nutrition.trendRange === 'all'
          ? Math.max(7, loggedDates.length || 7)
          : Number(state.nutrition.trendRange) || 7;
        const trendDates = [];
        if (state.nutrition.trendRange === 'all' && loggedDates.length) {
          loggedDates.forEach((d) => trendDates.push(d));
        } else {
          for (let i = rangeDays - 1; i >= 0; i--) trendDates.push(shiftDateStr(activeDate, -i));
        }

        const metricKey = ['cal', 'p', 'c', 'f'].includes(state.nutrition.trendMetric) ? state.nutrition.trendMetric : 'cal';
        const metricMeta = {
          cal: { label: 'Calories', unit: 'Cal', color: '#FA114F', goal: g.calories },
          p: { label: 'Protein', unit: 'g', color: '#92E82A', goal: g.protein },
          c: { label: 'Carbs', unit: 'g', color: '#00F5EA', goal: g.carbs },
          f: { label: 'Fat', unit: 'g', color: '#BF5AF2', goal: g.fat },
        }[metricKey];

        const trendSeries = trendDates.map((d) => {
          const dt = getNutritionTotals(d);
          const hasData = (state.nutrition.logsByDate[d] || []).length > 0;
          return { date: d, tot: dt, val: dt[metricKey] || 0, hasData };
        });
        const nonEmptySeries = trendSeries.filter((x) => x.hasData);
        const avgVal = nonEmptySeries.length ? nonEmptySeries.reduce((s, x) => s + x.val, 0) / nonEmptySeries.length : 0;
        const totalVal = nonEmptySeries.reduce((s, x) => s + x.val, 0);
        const maxVal = Math.max(metricMeta.goal || 1, ...trendSeries.map((x) => x.val), 1);

        const nutScope = state.nutrition.nutrientScope || 'day';
        let scopeTot = tot;
        if (nutScope === '7d') {
          const last7 = [];
          for (let i = 6; i >= 0; i--) last7.push(shiftDateStr(activeDate, -i));
          const active7 = last7.filter((d) => (state.nutrition.logsByDate[d] || []).length > 0);
          const denom = Math.max(1, active7.length);
          const sum7 = { micros: {} };
          FOODNOMS_MICRO_SCHEMA.forEach((m) => { sum7.micros[m.key] = 0; });
          active7.forEach((d) => {
            const dt = getNutritionTotals(d);
            FOODNOMS_MICRO_SCHEMA.forEach((m) => { sum7.micros[m.key] += dt.micros[m.key] || 0; });
          });
          scopeTot = { micros: Object.fromEntries(FOODNOMS_MICRO_SCHEMA.map((m) => [m.key, (sum7.micros[m.key] || 0) / denom])) };
        }

        const renderTrendChartSvg = () => {
          const W = 360, H = 150, padL = 8, padR = 8, padT = 18, padB = 22;
          const plotW = W - padL - padR, plotH = H - padT - padB;
          const n = Math.max(1, trendSeries.length);
          const step = plotW / n;
          const barW = Math.max(5, Math.min(26, step * 0.62));
          const goalY = metricMeta.goal ? (padT + plotH - Math.min(1, metricMeta.goal / maxVal) * plotH) : null;
          const avgY = avgVal > 0 ? (padT + plotH - Math.min(1, avgVal / maxVal) * plotH) : null;

          const bars = trendSeries.map((pt, i) => {
            const x = padL + i * step + (step - barW) / 2;
            const h = pt.val > 0 ? Math.max(3, (pt.val / maxVal) * plotH) : 2;
            const y = padT + plotH - h;
            const isSel = pt.date === activeDate;
            const labelEvery = n <= 8 ? 1 : n <= 16 ? 2 : Math.ceil(n / 6);
            const showLbl = (i % labelEvery === 0) || i === n - 1;
            return `
              <g class="trend-bar-hit cursor-pointer" data-date="${pt.date}">
                <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="3"
                  fill="${pt.hasData ? metricMeta.color : '#2C2C2E'}" opacity="${isSel ? '1' : (pt.hasData ? '0.82' : '0.4')}"
                  stroke="${isSel ? '#FFFFFF' : 'none'}" stroke-width="${isSel ? '1.5' : '0'}" />
                ${showLbl ? `<text x="${(x + barW / 2).toFixed(1)}" y="${H - 5}" text-anchor="middle" fill="${isSel ? '#FFFFFF' : '#8E8E93'}" font-size="8.5" font-weight="${isSel ? '700' : '500'}">${pt.date.slice(5)}</text>` : ''}
              </g>
            `;
          }).join('');

          return `
            <svg viewBox="0 0 ${W} ${H}" class="w-full h-40 overflow-visible">
              ${goalY !== null ? `
                <line x1="${padL}" y1="${goalY.toFixed(1)}" x2="${W - padR}" y2="${goalY.toFixed(1)}" stroke="#92E82A" stroke-width="1" stroke-dasharray="4 3" opacity="0.7" />
                <text x="${W - padR}" y="${Math.max(10, goalY - 4).toFixed(1)}" text-anchor="end" fill="#92E82A" font-size="8.5" font-weight="700">Goal ${Math.round(metricMeta.goal)}</text>
              ` : ''}
              ${avgY !== null ? `
                <line x1="${padL}" y1="${avgY.toFixed(1)}" x2="${W - padR}" y2="${avgY.toFixed(1)}" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="2 3" opacity="0.55" />
                <text x="${padL}" y="${Math.max(10, avgY - 4).toFixed(1)}" text-anchor="start" fill="#FFFFFF" font-size="8.5" font-weight="600">Avg ${Math.round(avgVal)}</text>
              ` : ''}
              ${bars}
            </svg>
          `;
        };

        root.innerHTML = `
          <!-- Clean Nutrition Header -->
          <div class="flex items-center justify-between mb-3 gap-2">
            <div class="flex items-center gap-1.5">
              <button id="btnNutriPrevDay" class="w-8 h-8 rounded-full bg-[#1C1C1E] border border-[#2C2C2E] text-white text-sm font-bold flex items-center justify-center">‹</button>
              <input id="nutriDatePick" type="date" value="${activeDate}" class="bg-[#1C1C1E] border border-[#2C2C2E] text-white text-xs font-semibold rounded-full px-3 py-1.5 outline-none" />
              <button id="btnNutriNextDay" class="w-8 h-8 rounded-full bg-[#1C1C1E] border border-[#2C2C2E] text-white text-sm font-bold flex items-center justify-center">›</button>
            </div>
            <div class="flex items-center gap-1.5">
              <button id="btnOpenLogModal" class="px-3 py-1.5 rounded-full bg-[#92E82A] text-[#000000] text-xs font-bold">+ Log / Import</button>
              <button id="btnMacroGoals" class="px-3 py-1.5 rounded-full bg-[#1C1C1E] border border-[#2C2C2E] text-xs font-bold text-white">⚙</button>
            </div>
          </div>

          <!-- Simple 3-View Switcher -->
          <div class="grid grid-cols-3 gap-1 p-1 rounded-2xl bg-[#1C1C1E] mb-3">
            ${[
              { id: 'today', label: 'Today' },
              { id: 'trends', label: 'Trends' },
              { id: 'nutrients', label: 'Nutrients' },
            ].map((t) => `
              <button class="nutri-subtab-btn py-2 rounded-xl text-xs font-bold ${subTab === t.id ? 'bg-[#92E82A] text-[#000000]' : 'text-[#8E8E93]'}" data-subtab="${t.id}">${t.label}</button>
            `).join('')}
          </div>

          ${subTab === 'today' ? `
            <!-- Calorie Ring + 3 Macro Bars -->
            <div class="bg-[#1C1C1E] rounded-[20px] p-4 mb-3 flex items-center gap-4">
              <div class="relative w-20 h-20 shrink-0 flex items-center justify-center">
                <svg class="w-20 h-20 -rotate-90" viewBox="0 0 80 80">
                  <circle cx="40" cy="40" r="${rCal}" fill="none" stroke="#3A0D18" stroke-width="7" />
                  <circle cx="40" cy="40" r="${rCal}" fill="none" stroke="#FA114F" stroke-width="7" stroke-linecap="round"
                    stroke-dasharray="${cCal}" stroke-dashoffset="${cCal * (1 - calPct / 100)}" />
                </svg>
                <div class="absolute text-center">
                  <div class="text-xs font-extrabold text-white leading-none">${Math.round(tot.cal)}</div>
                  <div class="text-[9px] text-[#8E8E93]">/${g.calories}</div>
                </div>
              </div>
              <div class="flex-1 space-y-2">
                ${[
                  { label: 'Protein', val: tot.p, goal: g.protein, color: '#92E82A' },
                  { label: 'Carbs', val: tot.c, goal: g.carbs, color: '#00F5EA' },
                  { label: 'Fat', val: tot.f, goal: g.fat, color: '#BF5AF2' },
                ].map((m) => {
                  const pct = Math.min(100, Math.round((m.val / Math.max(1, m.goal)) * 100));
                  return `
                    <div>
                      <div class="flex justify-between text-[11px] mb-0.5">
                        <span class="text-[#8E8E93] font-medium">${m.label}</span>
                        <span class="font-bold text-white tabular-nums">${Math.round(m.val)} / ${m.goal}g</span>
                      </div>
                      <div class="h-1.5 rounded-full bg-[#2C2C2E] overflow-hidden">
                        <div class="h-full rounded-full" style="width:${pct}%; background:${m.color}"></div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Single Clean Row of 4 Key Stats -->
            <div class="grid grid-cols-4 gap-2 mb-3 text-center">
              ${[
                { label: 'Water', val: `${Math.round(tot.micros.water || 0)} oz`, color: '#00F5EA' },
                { label: 'Fiber', val: `${Math.round(tot.micros.fiber || 0)}g`, color: '#92E82A' },
                { label: 'Sodium', val: `${Math.round(tot.micros.sodium || 0)}mg`, color: '#FF9F0A' },
                { label: 'Caffeine', val: `${Math.round(tot.micros.caffeine || 0)}mg`, color: '#BF5AF2' },
              ].map((k) => `
                <div class="bg-[#1C1C1E] rounded-2xl py-2.5 px-1">
                  <div class="text-[10px] text-[#8E8E93]">${k.label}</div>
                  <div class="text-xs font-bold tabular-nums mt-0.5" style="color:${k.color}">${k.val}</div>
                </div>
              `).join('')}
            </div>

            <!-- Meal-Grouped Food Log -->
            <div class="bg-[#1C1C1E] rounded-[20px] p-4">
              <div class="flex items-center justify-between mb-1">
                <div class="text-sm font-bold text-white">Meals • ${activeDate}</div>
                <div class="flex items-center gap-2">
                  ${activeDate !== latestLoggedDate && loggedDates.length ? `<button id="btnJumpLatestNutri" class="text-[11px] text-[#00F5EA] font-semibold">Latest (${latestLoggedDate.slice(5)})</button>` : ''}
                  ${logs.length ? `<button id="btnClearFoodLog" class="text-[11px] text-[#FA114F] font-semibold">Clear</button>` : ''}
                </div>
              </div>
              ${orderedMeals.length ? orderedMeals.map((m) => {
                const items = mealBuckets[m];
                const mt = sumNutritionItems(items);
                return `
                  <div class="mt-3 pt-2.5 border-t border-[#2C2C2E]">
                    <div class="flex items-center justify-between mb-1.5">
                      <span class="text-[11px] font-bold text-[#92E82A] uppercase tracking-wider">${m}</span>
                      <span class="text-[11px] text-[#8E8E93] tabular-nums">${Math.round(mt.cal)} Cal • ${Math.round(mt.p)}P / ${Math.round(mt.c)}C / ${Math.round(mt.f)}F</span>
                    </div>
                    ${items.map((item) => `
                      <div class="flex items-center justify-between py-1.5 text-xs">
                        <button class="food-detail-btn text-left flex-1 min-w-0 pr-2" data-idx="${item._idx}">
                          <div class="text-white font-semibold truncate">${item.name}${item.brand ? ` <span class="text-[#8E8E93] font-normal">(${item.brand})</span>` : ''}</div>
                          <div class="text-[10px] text-[#8E8E93]">${[item.portion, `${Math.round(item.cal)} Cal`, `${Math.round(item.p)}P / ${Math.round(item.c)}C / ${Math.round(item.f)}F`].filter(Boolean).join(' • ')}</div>
                        </button>
                        <button class="del-food-btn text-[#8E8E93] hover:text-[#FA114F] px-2 font-bold shrink-0" data-idx="${item._idx}">✕</button>
                      </div>
                    `).join('')}
                  </div>
                `;
              }).join('') : `<div class="text-xs text-[#636366] py-3">No meals logged for ${activeDate}. Tap <strong>+ Log / Import</strong> above to add food or import your Foodnoms CSV.</div>`}
            </div>

          ` : subTab === 'trends' ? `
            <!-- Clean Weekly & Multi-Day Trends -->
            <div class="bg-[#1C1C1E] rounded-[20px] p-4 mb-3">
              <div class="flex items-center justify-between gap-2 mb-3">
                <div class="flex gap-1 bg-[#0B0B0D] p-1 rounded-xl">
                  ${[
                    { id: 7, label: '7D' },
                    { id: 14, label: '14D' },
                    { id: 30, label: '30D' },
                    { id: 'all', label: 'All' },
                  ].map((r) => `
                    <button class="nutri-range-btn px-2.5 py-1 rounded-lg text-[11px] font-bold ${String(state.nutrition.trendRange) === String(r.id) ? 'bg-[#92E82A] text-[#000000]' : 'text-[#8E8E93]'}" data-range="${r.id}">${r.label}</button>
                  `).join('')}
                </div>
                <div class="flex gap-1">
                  ${[
                    { id: 'cal', label: 'Cal' },
                    { id: 'p', label: 'P' },
                    { id: 'c', label: 'C' },
                    { id: 'f', label: 'F' },
                  ].map((m) => `
                    <button class="nutri-metric-btn px-2.5 py-1 rounded-lg text-[11px] font-bold ${metricKey === m.id ? 'bg-[#2C2C2E] text-white' : 'text-[#8E8E93]'}" data-metric="${m.id}">${m.label}</button>
                  `).join('')}
                </div>
              </div>

              ${renderTrendChartSvg()}

              <div class="grid grid-cols-3 gap-2 mt-3 pt-3 border-t border-[#2C2C2E] text-center">
                <div>
                  <div class="text-[10px] text-[#8E8E93]">Daily Avg</div>
                  <div class="text-sm font-bold text-white tabular-nums">${Math.round(avgVal)} ${metricMeta.unit}</div>
                </div>
                <div>
                  <div class="text-[10px] text-[#8E8E93]">Period Total</div>
                  <div class="text-sm font-bold text-white tabular-nums">${Math.round(totalVal).toLocaleString()}</div>
                </div>
                <div>
                  <div class="text-[10px] text-[#8E8E93]">Days Logged</div>
                  <div class="text-sm font-bold text-[#92E82A] tabular-nums">${nonEmptySeries.length}/${trendDates.length}</div>
                </div>
              </div>
            </div>

            <!-- Daily Breakdown List -->
            <div class="bg-[#1C1C1E] rounded-[20px] p-4">
              <div class="text-xs font-bold text-white mb-2">Daily Breakdown</div>
              <div class="space-y-1 max-h-72 overflow-y-auto">
                ${trendSeries.slice().reverse().map((pt) => {
                  const delta = Math.round(pt.tot.cal - g.calories);
                  return `
                    <button class="trend-bar-hit w-full flex items-center justify-between py-2 px-2.5 rounded-xl ${pt.date === activeDate ? 'bg-[#2C2C2E]' : ''} text-xs" data-date="${pt.date}">
                      <span class="font-semibold text-white tabular-nums">${pt.date}</span>
                      <span class="text-[#8E8E93] tabular-nums">${pt.hasData ? `${Math.round(pt.tot.cal)} Cal • ${Math.round(pt.tot.p)}P / ${Math.round(pt.tot.c)}C / ${Math.round(pt.tot.f)}F` : '—'}</span>
                      <span class="font-bold tabular-nums ${!pt.hasData ? 'text-[#636366]' : (delta > 150 ? 'text-[#FA114F]' : 'text-[#92E82A]')}">${pt.hasData ? `${delta >= 0 ? '+' : ''}${delta}` : ''}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

          ` : `
            <!-- Clean Micronutrients View -->
            <div class="flex items-center justify-between bg-[#1C1C1E] rounded-2xl p-2.5 mb-3">
              <div class="text-xs font-semibold text-white pl-1">Vitamins, Minerals & Fats</div>
              <div class="flex gap-1 bg-[#0B0B0D] p-1 rounded-xl">
                <button class="nutri-scope-btn px-2.5 py-1 rounded-lg text-[11px] font-bold ${nutScope === 'day' ? 'bg-[#92E82A] text-[#000000]' : 'text-[#8E8E93]'}" data-scope="day">Day</button>
                <button class="nutri-scope-btn px-2.5 py-1 rounded-lg text-[11px] font-bold ${nutScope === '7d' ? 'bg-[#92E82A] text-[#000000]' : 'text-[#8E8E93]'}" data-scope="7d">7D Avg</button>
              </div>
            </div>

            ${['Carbs & Fats', 'Hydration & Stimulants', 'Minerals', 'Vitamins'].map((cat) => {
              const fields = FOODNOMS_MICRO_SCHEMA.filter((m) => m.cat === cat);
              return `
                <div class="bg-[#1C1C1E] rounded-[20px] p-4 mb-2.5">
                  <div class="text-[11px] font-bold text-[#92E82A] uppercase tracking-wider mb-2.5">${cat}</div>
                  <div class="space-y-2.5">
                    ${fields.map((m) => {
                      const val = scopeTot.micros[m.key] || 0;
                      const dispVal = val >= 10 ? Math.round(val) : Number(val.toFixed(1));
                      const pct = m.goal ? Math.min(100, Math.round((val / m.goal) * 100)) : (val > 0 ? 100 : 0);
                      const overLimit = m.limit && m.goal && val > m.goal;
                      return `
                        <div>
                          <div class="flex justify-between text-[11px] mb-1">
                            <span class="text-white font-medium">${m.label}</span>
                            <span class="tabular-nums font-bold ${overLimit ? 'text-[#FA114F]' : 'text-white'}">${dispVal} <span class="text-[#8E8E93] font-normal">${m.unit}${m.goal ? ` / ${m.goal}` : ''}</span></span>
                          </div>
                          <div class="h-1.5 rounded-full bg-[#2C2C2E] overflow-hidden">
                            <div class="h-full rounded-full" style="width:${pct}%; background:${overLimit ? '#FA114F' : m.color}"></div>
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          `}
        `;

        // Wire common header controls
        document.getElementById('nutriDatePick').addEventListener('change', (e) => {
          if (e.target.value) { state.nutrition.selectedDate = e.target.value; render(); }
        });
        document.getElementById('btnNutriPrevDay').addEventListener('click', () => {
          state.nutrition.selectedDate = shiftDateStr(activeDate, -1); render();
        });
        document.getElementById('btnNutriNextDay').addEventListener('click', () => {
          state.nutrition.selectedDate = shiftDateStr(activeDate, 1); render();
        });
        root.querySelectorAll('.nutri-subtab-btn').forEach((b) => b.addEventListener('click', () => {
          state.nutrition.subTab = b.dataset.subtab; render();
        }));
        const jumpLatest = document.getElementById('btnJumpLatestNutri');
        if (jumpLatest) jumpLatest.addEventListener('click', () => {
          state.nutrition.selectedDate = latestLoggedDate; render();
        });

        // Clean Log / Gemini / Foodnoms Import Modal
        document.getElementById('btnOpenLogModal').addEventListener('click', () => {
          const openLogSheet = () => {
            openModal('Log Food or Import Data', `
              <div class="space-y-3 text-xs">
                <div class="grid grid-cols-3 gap-1 p-1 rounded-xl bg-[#0B0B0D]">
                  ${[
                    { id: 'ai', label: 'Gemini AI' },
                    { id: 'quick', label: 'Quick Add' },
                    { id: 'sync', label: 'Import / Export' },
                  ].map((t) => `
                    <button class="modal-log-mode py-2 rounded-lg font-bold ${state.nutrition.mode === t.id ? 'bg-[#92E82A] text-[#000000]' : 'text-[#8E8E93]'}" data-mode="${t.id}">${t.label}</button>
                  `).join('')}
                </div>

                ${state.nutrition.mode === 'ai' ? `
                  <div class="space-y-2.5">
                    <div class="text-[#8E8E93]">Describe any meal and <strong>Gemini 2.5 Flash</strong> will estimate calories, macros, fiber, sodium & water.</div>
                    <select id="mMealSel" class="num-input text-left px-3">
                      ${['Breakfast', 'Lunch', 'Dinner', 'Pre-Workout', 'Post-Workout', 'Snack'].map((m) => `<option ${state.nutrition.mealTarget === m ? 'selected' : ''}>${m}</option>`).join('')}
                    </select>
                    <textarea id="aiMealPrompt" rows="3" placeholder="e.g. 2 scrambled eggs, 2 slices sourdough toast, 1 tbsp butter, 12oz black coffee" class="w-full bg-[#2C2C2E] text-white text-xs rounded-xl p-3 outline-none"></textarea>
                    ${!state.nutrition.geminiKey ? `<input id="mGeminiInlineKey" type="password" placeholder="Paste Gemini API Key (saved locally)" class="num-input text-left px-3" />` : ''}
                    <button id="btnRunAiParse" class="w-full py-3 rounded-xl bg-[#92E82A] text-[#000000] font-bold">Parse Meal with Gemini AI</button>
                  </div>
                ` : state.nutrition.mode === 'quick' ? `
                  <div class="space-y-2">
                    <select id="mMealSelQ" class="num-input text-left px-3">
                      ${['Breakfast', 'Lunch', 'Dinner', 'Pre-Workout', 'Post-Workout', 'Snack'].map((m) => `<option ${state.nutrition.mealTarget === m ? 'selected' : ''}>${m}</option>`).join('')}
                    </select>
                    <input id="qFoodName" type="text" placeholder="Food name" class="num-input text-left px-3" />
                    <div class="grid grid-cols-4 gap-1.5">
                      <input id="qCal" type="number" placeholder="Cal" class="num-input" />
                      <input id="qPro" type="number" placeholder="P (g)" class="num-input" />
                      <input id="qCarb" type="number" placeholder="C (g)" class="num-input" />
                      <input id="qFat" type="number" placeholder="F (g)" class="num-input" />
                    </div>
                    <button id="btnLogQuickFood" class="w-full py-3 rounded-xl bg-[#92E82A] text-[#000000] font-bold">Add to ${activeDate}</button>
                  </div>
                ` : `
                  <div class="space-y-2.5">
                    <div class="text-[#8E8E93]">Import your <strong>Foodnoms Food Log.csv</strong> (all 51 columns & dates) or export your Nutrition data separately from Training.</div>
                    <label class="block w-full py-3 rounded-xl bg-[#92E82A] text-[#000000] font-bold text-center cursor-pointer">
                      Import Foodnoms CSV or JSON
                      <input id="inpImportNutrition" type="file" accept=".json,.csv,text/csv,application/json" class="hidden" />
                    </label>
                    <div class="grid grid-cols-2 gap-2">
                      <button id="btnExportNutritionCsv" class="py-2.5 rounded-xl bg-[#2C2C2E] text-white font-bold">Export CSV</button>
                      <button id="btnExportNutrition" class="py-2.5 rounded-xl bg-[#2C2C2E] text-white font-bold">Export JSON</button>
                    </div>
                  </div>
                `}

            Object.entries(sr.maxes || {}).forEach(([exId, m]) => {
              const e1rm = m.reps > 1 ? Math.round(m.weight * (1 + m.reps / 30) * 10) / 10 : m.weight;
              rows.push(['Saved Round Max', sr.round, sr.completedAt, EXERCISES[exId]?.name || exId, '', m.reps, m.weight, state.unit, e1rm].map(esc).join(','));
            });
          });
          const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `apex-hybrid-training-${new Date().toISOString().slice(0, 10)}.csv`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        });
        document.getElementById('btnExportBackup').addEventListener('click', () => {
          const payload = {
            version: 2,
            exportedAt: new Date().toISOString(),
            unit: state.unit,
            selectedWeek: state.selectedWeek,
            currentDayIdx: state.currentDayIdx,
            completedDays: state.completedDays,
            history: state.history,
            peakWeights: state.peakWeights,
            roundNumber: state.roundNumber,
            savedRounds: state.savedRounds,
            health: state.health,
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `apex-hybrid-training-${new Date().toISOString().slice(0, 10)}.json`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        });
        document.getElementById('inpImportBackup').addEventListener('change', (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const data = JSON.parse(String(reader.result || '{}'));
              if (data.unit) state.unit = data.unit;
              if (data.selectedWeek) state.selectedWeek = data.selectedWeek;
              if (typeof data.currentDayIdx === 'number') state.currentDayIdx = data.currentDayIdx;
              if (Array.isArray(data.completedDays)) state.completedDays = data.completedDays;
              if (Array.isArray(data.history)) state.history = data.history;
              if (data.peakWeights) state.peakWeights = data.peakWeights;
              if (data.roundNumber) state.roundNumber = data.roundNumber;
              if (Array.isArray(data.savedRounds)) state.savedRounds = data.savedRounds;
              if (data.health) state.health = data.health;
              persistState();
              render();
              openModal('Backup Restored', `<div class="text-white font-semibold">Restored ${state.history.length} workout(s) and ${Object.keys(state.peakWeights).length} PR(s).</div>`);
            } catch (err) {
              openModal('Import Error', `<div class="text-[#FA114F]">Invalid backup JSON file.</div>`);
            }
          };
          reader.readAsText(file);
        });
      }
    }

    render();
  </script>
</body>
</html>
